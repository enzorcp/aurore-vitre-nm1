name: Mise à jour calendrier Aurore Vitré NM1

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Installer Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Générer le calendrier
        run: |
          python generate_calendar.py

      - name: Vérifier le calendrier
        run: |
          test -f calendrier.ics
          echo "Calendrier généré :"
          wc -l calendrier.ics
          head -n 10 calendrier.ics

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendrier.ics
          git diff --cached --quiet || git commit -m "Mise à jour du calendrier NM1"
          git push
