name: Mise à jour calendrier Châtillon DM4

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chatillon-calendar:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Installer Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Générer le calendrier
        run: |
          python generate_chatillon_calendar.py

      - name: Vérifier le fichier
        run: |
          test -f calendrier-chatillon.ics
          echo "Calendrier généré :"
          wc -l calendrier-chatillon.ics

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendrier-chatillon.ics

          git diff --cached --quiet || git commit -m "Mise à jour calendrier Châtillon DM4"

          git push
