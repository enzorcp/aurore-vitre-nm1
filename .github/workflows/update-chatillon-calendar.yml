name: Mise à jour calendrier Châtillon DM4

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Générer le calendrier
        run: |
          python generate_chatillon_calendar.py

      - name: Vérifier le fichier ICS
        run: |
          test -f calendrier-chatillon.ics

          echo "Calendrier généré :"

          COUNT=$(grep -c "BEGIN:VEVENT" calendrier-chatillon.ics)

          echo "Nombre de matchs : $COUNT"

          if [ "$COUNT" -lt 18 ]; then
            echo "ERREUR : moins de 18 matchs dans le calendrier."
            exit 1
          fi

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendrier-chatillon.ics

          git diff --cached --quiet || \
            git commit -m "Mise à jour du calendrier Châtillon DM4"

          git push
