name: Mise à jour calendrier Châtillon DM4

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Récupérer le dépôt
      # =====================================================

      - name: Récupérer le dépôt
        uses: actions/checkout@v4


      # =====================================================
      # Installer Python
      # =====================================================

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"


      # =====================================================
      # Installer le client FFBB
      # =====================================================

      - name: Installer le client FFBB
        run: |
          python -m pip install --upgrade pip
          pip install ffbb-api-client-v2==1.4.0


      # =====================================================
      # Générer le calendrier
      # =====================================================

      - name: Générer le calendrier
        run: |
          python generate_chatillon_calendar.py


      # =====================================================
      # Vérifier le fichier ICS
      # =====================================================

      - name: Vérifier le fichier ICS
        run: |
          test -f calendrier-chatillon.ics

          echo "Calendrier généré :"
          grep -c "BEGIN:VEVENT" calendrier-chatillon.ics

          echo ""
          echo "Premières lignes du calendrier :"
          head -20 calendrier-chatillon.ics


      # =====================================================
      # Enregistrer les modifications
      # =====================================================

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendrier-chatillon.ics

          if git diff --cached --quiet; then
            echo "Aucune modification du calendrier."
          else
            git commit -m "Mise à jour du calendrier Châtillon DM4"
            git push
          fi
